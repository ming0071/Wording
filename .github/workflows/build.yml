name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release version and tag
        id: release
        run: python scripts/release.py metadata
      - name: Test release validation scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Test fixed-path app updates
        run: ./scripts/tests/test_update_current.ps1
      - name: Validate original starter vocabulary
        run: python scripts/validate-content.py
      - name: Build and test
        run: ./scripts/build.ps1 -LockedRestore
      - name: Publish Windows package
        run: ./scripts/publish.ps1 -LockedRestore
      - name: Verify Windows package and checksum
        run: |
          python scripts/verify-package.py | Tee-Object artifacts/test-results/package-validation.txt
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Check dependency locks remain unchanged
        run: |
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Build or publish changed dependency locks' }
      - name: Stage only release attachments
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $taskPackage = "artifacts/Wording-$env:RELEASE_VERSION-win-x64.zip"
          Copy-Item -LiteralPath $taskPackage,"$taskPackage.sha256",content/toeic-vocabulary.json -Destination artifacts/release
      - name: Verify release inputs before upload
        if: steps.release.outputs.release == 'true'
        run: python scripts/release.py check
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Wording-win-x64
          compression-level: 0
          retention-days: 14
          path: |
            artifacts/release/*
          if-no-files-found: error
      - name: Upload test reports and dependency locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-evidence
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/layout-check/**
            **/packages.lock.json
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        run: |
          $taskReport = 'artifacts/test-results/tests.trx'
          if (Test-Path -LiteralPath $taskReport) {
            $taskCounts = ([xml](Get-Content -LiteralPath $taskReport -Raw)).TestRun.ResultSummary.Counters
            "Tests: $($taskCounts.passed) passed, $($taskCounts.failed) failed, $($taskCounts.total) total." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $taskPackageReport = 'artifacts/test-results/package-validation.txt'
          if (Test-Path -LiteralPath $taskPackageReport) {
            Get-Content -LiteralPath $taskPackageReport | Add-Content $env:GITHUB_STEP_SUMMARY
          }

  release:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Wording-win-x64
          path: artifacts/release
      - name: Publish verified draft and attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish
